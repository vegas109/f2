name: codehero
description: "CodeHero: Python & C++ Mastery — an interactive, gamified guide to learning Python and C++."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0

  # --- State management ---
  flutter_riverpod: ^2.5.1

  # --- Routing ---
  go_router: ^14.2.0

  # --- Networking (Piston / Judge0 code execution API) ---
  http: ^1.2.1

  # --- Local storage (offline lessons + cached progress) ---
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3

  # --- Firebase (optional: app runs in Local mode until you run `flutterfire configure`) ---
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.1
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.0

  # --- Monetization ---
  in_app_purchase: ^3.2.0
  google_mobile_ads: ^5.1.0

  # --- UI / UX ---
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  smooth_page_indicator: ^1.1.0

  # --- Code editor / syntax highlighting for the Sandbox ---
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0

  # --- Utils ---
  equatable: ^2.0.5
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/curriculum/
