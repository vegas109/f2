name: codehero
description: "CodeHero: Python & C++ Mastery — an interactive, gamified guide to learning Python and C++."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0

  # --- State management ---
  flutter_riverpod: ^2.5.1

  # --- Routing ---
  go_router: ^14.2.0

  # --- Networking (Piston / Judge0 code execution API) ---
  http: ^1.2.1

  # --- Local storage (offline progress; lessons ship as bundled assets) ---
  shared_preferences: ^2.2.3

  # --- Monetization ---
  in_app_purchase: ^3.2.0
  # NOTE: google_mobile_ads is intentionally NOT added yet — its SDK
  # auto-initializes at launch and crashes if the AdMob App ID is missing
  # from the native manifests, which would break out-of-the-box runs. Add it
  # (and the AdMob App ID) when wiring real ads, then swap RewardedAdService.

  # --- UI / UX ---
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0

  # --- Utils ---
  equatable: ^2.0.5

  # --- Firebase ---
  # Intentionally NOT listed yet. The app runs fully in Local mode without it.
  # `flutterfire configure` adds firebase_core/auth/cloud_firestore (plus
  # google_sign_in / sign_in_with_apple) when you enable cloud sync. Keeping
  # them out now avoids native build friction (Gradle/CocoaPods) for the first
  # build. See docs/architecture.md and README "Enabling Firebase".

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/curriculum/
